name: 🤖 Auto Progress Tracker (GitHub Projects Autopilot)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  track-progress:
    name: Inspeccionar Codigo y Actualizar Tablero
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Evaluar Reglas de Codigo y Sincronizar Issues
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const baseDir = path.join(process.cwd(), 'fullstack-react-parcial-1');

            const fileExists = (relPath) => fs.existsSync(path.join(baseDir, relPath));
            const fileContains = (relPath, str) => {
              const fullPath = path.join(baseDir, relPath);
              if (!fs.existsSync(fullPath)) return false;
              return fs.readFileSync(fullPath, 'utf8').includes(str);
            };

            const tasks = [
              {
                id: 1,
                tag: 'Tarea 01',
                title: 'Tarea 01 · Setup de Arquitectura, Vite, Vitest y Bootstrap',
                check: () => fileExists('vite.config.js') && fileExists('src/setupTests.js') && fileExists('package.json'),
                coachTip: 'Configura Vite con el plugin de React, Vitest para jsdom y carga los estilos de Bootstrap en src/main.jsx.'
              },
              {
                id: 2,
                tag: 'Tarea 02',
                title: 'Tarea 02 · Motor de Utilidades y Reglas de Negocio (RUT, IVA y Stock)',
                check: () => fileExists('src/utils/validaciones.js') && fileExists('src/utils/finanzas.js') && fileExists('src/utils/stock.js'),
                coachTip: 'Implementa el algoritmo Módulo 11 en validaciones.js, el cálculo de IVA 19% en finanzas.js y el stock crítico en stock.js con sus respectivos tests.'
              },
              {
                id: 3,
                tag: 'Tarea 03',
                title: 'Tarea 03 · Estado Global del Carrito con CartContext y Custom Hook useContador',
                check: () => fileExists('src/context/CartContext.jsx') && fileExists('src/hooks/useContador.js'),
                coachTip: 'Crea el CartProvider con persistencia en localStorage y el custom hook useContador con límites de stock mínimo y máximo.'
              },
              {
                id: 4,
                tag: 'Tarea 04',
                title: 'Tarea 04 · Capa de Servicios HTTP y Catálogo de Datos Maestro',
                check: () => fileExists('src/services/api.js') && fileExists('src/data/productos.js'),
                coachTip: 'Configura la instancia de Axios en api.js y exporta el catálogo de 51 productos en src/data/productos.js.'
              },
              {
                id: 5,
                tag: 'Tarea 05',
                title: 'Tarea 05 · Navegación Global (Navbar, Footer) y Landing Page Home',
                check: () => fileExists('src/components/Navbar.jsx') && fileExists('src/pages/Home.jsx'),
                coachTip: 'Construye la barra de navegación con el badge reactivo del carrito, el Footer y la vista Home con sus secciones modulares.'
              },
              {
                id: 6,
                tag: 'Tarea 06',
                title: 'Tarea 06 · Catálogo de Productos Completo con Filtros y Buscador',
                check: () => fileExists('src/pages/Productos.jsx') && fileContains('src/App.jsx', 'Productos'),
                coachTip: 'Construye src/pages/Productos.jsx con buscador en tiempo real, filtros por categoría con chips y conecta la ruta /productos en App.jsx.'
              },
              {
                id: 7,
                tag: 'Tarea 07',
                title: 'Tarea 07 · Ficha Técnica de Producto Individual (ProductDetail)',
                check: () => fileExists('src/pages/ProductoDetalle.jsx') && fileContains('src/App.jsx', 'ProductoDetalle'),
                coachTip: 'Crea src/pages/ProductoDetalle.jsx usando useParams para obtener el :codigo del producto, integrando selector de cantidad useContador y botón de agregar.'
              },
              {
                id: 8,
                tag: 'Tarea 08',
                title: 'Tarea 08 · Carrito de Compras Interactivo y Resumen Fiscal',
                check: () => fileExists('src/pages/Carrito.jsx') && fileContains('src/App.jsx', 'Carrito'),
                coachTip: 'Crea src/pages/Carrito.jsx conectado al CartContext, con tabla interactiva, desglose de IVA 19% y total CLP, estado vacío amigable y botón de checkout.'
              },
              {
                id: 9,
                tag: 'Tarea 09',
                title: 'Tarea 09 · Formularios de Autenticación (Login) y Registro con Validación Reactiva',
                check: () => fileExists('src/pages/Login.jsx') && fileExists('src/pages/Registro.jsx') && fileContains('src/App.jsx', 'Login'),
                coachTip: 'Crea src/pages/Login.jsx y src/pages/Registro.jsx con validación reactiva de RUT (Módulo 11) y selectores en cascada Región-Comuna.'
              },
              {
                id: 10,
                tag: 'Tarea 10',
                title: 'Tarea 10 · Páginas Institucionales (Nosotros, Contacto y Blogs)',
                check: () => fileExists('src/pages/Nosotros.jsx') && fileExists('src/pages/Contacto.jsx') && fileContains('src/App.jsx', 'Contacto'),
                coachTip: 'Implementa Nosotros.jsx y Contacto.jsx con contador reactivo de caracteres (límite 500) y conecta sus enlaces en el Navbar y Footer.'
              },
              {
                id: 11,
                tag: 'Tarea 11',
                title: 'Tarea 11 · Módulo Administrativo (Dashboard y CRUD de Inventario)',
                check: () => (fileExists('src/pages/Admin.jsx') || fileExists('src/pages/admin/AdminDashboard.jsx') || fileExists('src/pages/admin/AdminProductos.jsx')) && (fileContains('src/App.jsx', 'Admin') || fileContains('src/App.jsx', 'admin')),
                coachTip: 'Construye el panel administrativo con métricas de catálogo, stock crítico y tabla CRUD interactiva para administrar productos.'
              },
              {
                id: 12,
                tag: 'Tarea 12',
                title: 'Tarea 12 · Suite Integral de Pruebas Unitarias, Cobertura y Accesibilidad',
                check: () => (fileExists('src/pages/Productos.test.jsx') || fileExists('src/pages/Carrito.test.jsx') || fileExists('src/pages/Registro.test.jsx')),
                coachTip: 'Escribe pruebas de componentes con Testing Library para las páginas principales y valida accesibilidad con jest-axe hasta superar el 80% de cobertura.'
              },
              {
                id: 13,
                tag: 'Tarea 13',
                title: 'Tarea 13 · Vistas de Categorías y Ofertas',
                check: () => fileExists('src/pages/Categorias.jsx') && fileExists('src/pages/Ofertas.jsx'),
                coachTip: 'Crea vistas especializadas de Categorias y Ofertas con grilla responsiva reutilizando ProductCard.'
              },
              {
                id: 14,
                tag: 'Tarea 14',
                title: 'Tarea 14 · Checkout con datos de envío',
                check: () => fileExists('src/pages/Checkout.jsx') && fileExists('src/components/checkout/ResumenPedido.jsx'),
                coachTip: 'Implementa la vista Checkout con selectores dependientes de region/comuna y resumen tributario del pedido.'
              },
              {
                id: 15,
                tag: 'Tarea 15',
                title: 'Tarea 15 · Vistas de compra exitosa y pago fallido',
                check: () => fileExists('src/pages/CompraExitosa.jsx') && fileExists('src/pages/PagoFallido.jsx'),
                coachTip: 'Crea las paginas de confirmacion y rechazo de transaccion con desglose de orden.'
              },
              {
                id: 16,
                tag: 'Tarea 16',
                title: 'Tarea 16 · Mantenedor de usuarios con roles',
                check: () => fileExists('src/pages/admin/AdminUsuarios.jsx') && fileContains('src/App.jsx', 'AdminUsuarios'),
                coachTip: 'Desarrolla el mantenedor CRUD de cuentas de usuario con roles de Administrador, Vendedor y Cliente.'
              },
              {
                id: 17,
                tag: 'Tarea 17',
                title: 'Tarea 17 · Pruebas de páginas institucionales y ficha de producto',
                check: () => fileExists('src/pages/Nosotros.test.jsx') && fileExists('src/pages/Blogs.test.jsx') && fileExists('src/pages/ProductoDetalle.test.jsx'),
                coachTip: 'Escribe suites de pruebas unitarias para vistas institucionales y detalle de producto.'
              },
              {
                id: 18,
                tag: 'Tarea 18',
                title: 'Tarea 18 · Pruebas del panel administrativo',
                check: () => fileExists('src/pages/admin/AdminProductos.test.jsx') && fileExists('src/pages/admin/AdminUsuarios.test.jsx'),
                coachTip: 'Crea pruebas unitarias para flujos CRUD de productos y usuarios en el panel administrativo.'
              },
              {
                id: 19,
                tag: 'Tarea 19',
                title: 'Tarea 19 · Validación de autenticación en Checkout y flujo de redirección',
                check: () => fileContains('src/pages/Checkout.jsx', 'useAuth'),
                coachTip: 'Conecta Checkout al estado de sesion para autocompletar datos del comprador y proteger el acceso.'
              },
              {
                id: 20,
                tag: 'Tarea 20',
                title: 'Tarea 20 · Asociación de compras al historial del cliente y persistencia de órdenes',
                check: () => fileContains('src/utils/checkout.js', 'sonido_vivo_ordenes') || fileContains('src/pages/Checkout.jsx', 'localStorage'),
                coachTip: 'Persiste ordenes confirmadas en almacenamiento local con fecha, items, datos de entrega y total fiscal.'
              },
              {
                id: 21,
                tag: 'Tarea 21',
                title: 'Tarea 21 · Pruebas unitarias para el flujo de autenticación y redirección en Checkout',
                check: () => fileExists('src/pages/Checkout.test.jsx') && fs.existsSync(path.join(process.cwd(), 'Dockerfile')),
                coachTip: 'Valida el flujo de compra y autenticacion en Checkout con pruebas unitarias y empaquetado Docker.'
              },
              {
                id: 22,
                tag: 'Tarea 22',
                title: 'Tarea 22 · [FE-01] Adaptador HTTP y Cliente de Consultas NoSQL (productoService.js)',
                check: () => fileExists('src/services/productoService.js') && fileExists('src/services/productoService.test.js'),
                coachTip: 'Implementa productoService.js con JWT Bearer, mapeo DTO MongoDB, mutaciones atomicas y fallback offline.'
              },
              {
                id: 23,
                tag: 'Tarea 23',
                title: 'Tarea 23 · [FE-02] Visualizador de Metricas de Agregacion MongoDB (AdminMongoKpis.jsx)',
                check: () => fileExists('src/components/admin/AdminMongoKpis.jsx') && fileExists('src/components/admin/AdminMongoKpis.test.jsx'),
                coachTip: 'Crea AdminMongoKpis.jsx con capital total en CLP, unidades/categorias activas y alerta de stock critico <= 3.'
              },
              {
                id: 24,
                tag: 'Tarea 24',
                title: 'Tarea 24 · [FE-03] Query Builder de Filtros Polimorficos NoSQL (MongoQueryBar.jsx)',
                check: () => fileExists('src/components/admin/MongoQueryBar.jsx') && fileExists('src/components/admin/MongoQueryBar.test.jsx'),
                coachTip: 'Crea MongoQueryBar.jsx con busqueda full-text, chips de categorias, filtro por estado de documento y tests.'
              },
              {
                id: 25,
                tag: 'Tarea 25',
                title: 'Tarea 25 · [FE-04] Inspector Lateral de Documento BSON & Reseñas (BsonDocumentDrawer.jsx)',
                check: () => fileExists('src/components/admin/BsonDocumentDrawer.jsx') && fileExists('src/components/admin/BsonDocumentDrawer.test.jsx'),
                coachTip: 'Implementa BsonDocumentDrawer.jsx para inspeccionar documentos BSON y gestionar resenas embebidas.'
              },
              {
                id: 26,
                tag: 'Tarea 26',
                title: 'Tarea 26 · [FE-05] Integracion en AdminProductos y Suite de Pruebas de Regresion',
                check: () => fileContains('src/pages/admin/AdminProductos.jsx', 'AdminMongoKpis') && fileContains('src/pages/admin/AdminProductos.jsx', 'MongoQueryBar') && fileContains('src/pages/admin/AdminProductos.jsx', 'BsonDocumentDrawer'),
                coachTip: 'Integra AdminMongoKpis, MongoQueryBar y BsonDocumentDrawer en AdminProductos.jsx con tests de regresion.'
              },
              {
                id: 27,
                tag: 'Tarea 27',
                title: 'Tarea 27 · [FE-06] Filtro Dinamico de Categorias y Busqueda en Catalogo Publico (Productos.jsx)',
                check: () => fileContains('src/services/productoService.js', '/api/v1/public/products') && fileContains('src/pages/Productos.jsx', 'productoService'),
                coachTip: 'Conecta src/pages/Productos.jsx a /api/v1/public/products con fallback offline, categorias dinamicas desde MongoDB y busqueda con debounce.'
              },
              {
                id: 28,
                tag: 'Tarea 28',
                title: 'Tarea 28 · [FE-07] Confirmacion Visual y Simulacion de Pago en Checkout (Checkout.jsx)',
                check: () => (fileContains('src/pages/Checkout.jsx', '/api/v1/store/sales') || fileContains('src/services/ventaService.js', '/api/v1/store/sales') || fileContains('src/services/productoService.js', '/api/v1/store/sales')) && (fileContains('src/pages/Checkout.jsx', 'WebPay') || fileContains('src/pages/Checkout.jsx', 'metodoPago')),
                coachTip: 'Agrega seleccion de metodo de pago (WebPay/Transferencia), datos de facturacion, validacion previa de stock y envio POST /api/v1/store/sales en Checkout.jsx.'
              },
              {
                id: 29,
                tag: 'Tarea 29',
                title: 'Tarea 29 · [FE-08] Modularizacion de Componentes para Extraccion de Landing Independiente',
                check: () => fileExists('src/components/showcase/ProductShowcaseGrid.jsx') && fileExists('src/components/showcase/MiniCartDrawer.jsx'),
                coachTip: 'Crea ProductShowcaseGrid.jsx y MiniCartDrawer.jsx desacoplados en src/components/showcase/ y documenta su integracion en README.md.'
              }
            ];

            // Obtener issues actuales del repo (excluyendo Pull Requests)
            const issuesResp = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'all',
              per_page: 100
            });
            const issues = issuesResp.data.filter(i => !i.pull_request);

            let firstPendingAssigned = false;

            for (const task of tasks) {
              const issue = issues.find(i => i.title.includes(task.tag));
              if (!issue) {
                console.log(`[AVISO] No se encontro Issue para '${task.tag}'. Ejecuta el workflow 'Seed Project Backlog'.`);
                continue;
              }

              const isDone = task.check();
              const currentLabels = issue.labels.map(l => (typeof l === 'string' ? l : l.name));

              if (isDone) {
                // TAREA CUMPLIDA
                const newLabels = currentLabels
                  .filter(l => l !== 'estado: en-curso' && l !== 'estado: por-hacer')
                  .concat(!currentLabels.includes('estado: finalizado') ? ['estado: finalizado'] : []);

                if (issue.state !== 'closed' || !currentLabels.includes('estado: finalizado')) {
                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: issue.number,
                    state: 'closed',
                    state_reason: 'completed',
                    labels: newLabels
                  });
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: issue.number,
                    body: `✅ **Tarea Verificada en Codigo**\n\nEl escaner automatico de GitHub Actions detecto los componentes y contratos tecnicos requeridos para esta tarea en la rama principal.\n\n- **Estado:** Cerrado automaticamente.\n- **Tablero:** Movido a columna \`Done\` en GitHub Projects.`
                  });
                  console.log(`[FINALIZADA] Issue #${issue.number} - ${task.title}`);
                }
              } else {
                // TAREA PENDIENTE
                if (!firstPendingAssigned) {
                  // Primera tarea pendiente -> EN CURSO
                  firstPendingAssigned = true;

                  const newLabels = currentLabels
                    .filter(l => l !== 'estado: por-hacer' && l !== 'estado: finalizado')
                    .concat(!currentLabels.includes('estado: en-curso') ? ['estado: en-curso'] : []);

                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: issue.number,
                    state: 'open',
                    labels: newLabels
                  });

                  // Verificar si ya se comento la guia del coach
                  const comments = await github.rest.issues.listComments({
                    owner,
                    repo,
                    issue_number: issue.number
                  });
                  const alreadyGuided = comments.data.some(c => c.body.includes('🎯 **Guía Paso a Paso de la IA (Coach)**'));

                  if (!alreadyGuided) {
                    await github.rest.issues.createComment({
                      owner,
                      repo,
                      issue_number: issue.number,
                      body: `🎯 **Guía Paso a Paso de la IA (Coach)**\n\nEsta tarea ha sido promovida a **EN CURSO** para el equipo:\n\n> 💡 **Instrucción para el equipo:**\n> ${task.coachTip}\n\n*Al hacer \`git push origin main\` con los cambios, este issue se verificara y cerrara automaticamente.*`
                    });
                  }
                  console.log(`[EN CURSO] Issue #${issue.number} - ${task.title}`);
                } else {
                  // Tareas pendientes posteriores -> POR HACER
                  const newLabels = currentLabels
                    .filter(l => l !== 'estado: en-curso' && l !== 'estado: finalizado')
                    .concat(!currentLabels.includes('estado: por-hacer') ? ['estado: por-hacer'] : []);

                  if (currentLabels.includes('estado: en-curso') || !currentLabels.includes('estado: por-hacer')) {
                    await github.rest.issues.update({
                      owner,
                      repo,
                      issue_number: issue.number,
                      state: 'open',
                      labels: newLabels
                    });
                  }
                  console.log(`[POR HACER] Issue #${issue.number} - ${task.title}`);
                }
              }
            }
